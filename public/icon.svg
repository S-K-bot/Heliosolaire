<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle / safe zone padded -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer ambient solar glow -->
  <circle cx="256" cy="190" r="100" fill="#f59e0b" opacity="0.2" filter="url(#glow)" />

  <!-- Sun with rays -->
  <g transform="translate(256, 175)">
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="54" fill="url(#sunGrad)" />
    
    <!-- Rays -->
    <g stroke="url(#sunGrad)" stroke-width="8" stroke-linecap="round" opacity="0.9">
      <line x1="0" y1="-74" x2="0" y2="-90" />
      <line x1="52" y1="-52" x2="64" y2="-64" />
      <line x1="74" y1="0" x2="90" y2="0" />
      <line x1="52" y1="52" x2="64" y2="64" />
      <line x1="0" y1="74" x2="0" y2="90" />
      <line x1="-52" y1="52" x2="-64" y2="64" />
      <line x1="-74" y1="0" x2="-90" y2="0" />
      <line x1="-52" y1="-52" x2="-64" y2="-64" />
    </g>
  </g>

  <!-- Solar Photovoltaic Grid Panel Perspective -->
  <g transform="translate(106, 260)">
    <!-- Panel Frame Backdrop -->
    <polygon points="50,0 250,0 300,160 0,160" fill="#0f172a" stroke="#475569" stroke-width="4" />
    
    <!-- Panel Cells with blue glass gradient -->
    <polygon points="52,4 248,4 296,156 4,156" fill="url(#panelGrad)" opacity="0.95" />

    <!-- Grid Lines (Horizontal) -->
    <line x1="38" y1="40" x2="262" y2="40" stroke="#bae6fd" stroke-width="2.5" opacity="0.8" />
    <line x1="26" y1="80" x2="274" y2="80" stroke="#bae6fd" stroke-width="2.5" opacity="0.8" />
    <line x1="14" y1="120" x2="286" y2="120" stroke="#bae6fd" stroke-width="2.5" opacity="0.8" />

    <!-- Grid Lines (Vertical Perspective) -->
    <line x1="100" y1="0" x2="65" y2="160" stroke="#bae6fd" stroke-width="2.5" opacity="0.8" />
    <line x1="150" y1="0" x2="150" y2="160" stroke="#bae6fd" stroke-width="3" opacity="0.8" />
    <line x1="200" y1="0" x2="235" y2="160" stroke="#bae6fd" stroke-width="2.5" opacity="0.8" />
    
    <!-- Energy Spark / Lightning Zap -->
    <path d="M 152 40 L 138 95 L 158 95 L 140 145 L 172 82 L 150 82 Z" fill="#fef08a" stroke="#d97706" stroke-width="2" filter="url(#glow)" />
  </g>
</svg>
